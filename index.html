<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piezômetros">
<title>Leitura de piezômetros</title>
<style>
/* VOICE: ferramenta de campo da ENG Consultoria — direta, legível no sol
   IDEA: a ficha de campo do piezômetro, agrupada por ponto (A/B juntos), como se anda no aterro
   PICTURE: a lista por ponto e o cartão azul "você está no ponto"
   COLOUR: azuis da ENG (#0B5A8A placa, #2B9FD3 destaque), fundo azul-acinzentado, cinza asfalto no texto
   TYPE: DIN/Bahnschrift para títulos e números; system-ui no texto. LAYOUT: uma coluna, botões de polegar */
:root{color-scheme:light;--placa:#0B5A8A;--placa-esc:#083F61;--az:#2B9FD3;--az-esc:#1E86BF;--asf:#2B2F33;--cinza:#5E6B74;--linha:#D2DDE4;--fundo:#EEF3F6;--card:#fff;
--ok:#2E7D4F;--okbg:#E4F2EA;--warn:#9A6A00;--warnbg:#FFF4D6;--bad:#B3261E;--badbg:#FCE8E6;
--sign:"DIN Alternate","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--fundo);color:var(--asf)}
body{font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid var(--az);box-shadow:0 2px 10px rgba(11,90,138,.08);padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{height:36px;width:auto;display:block}
.logot{font:700 18px var(--sign);color:var(--cinza);letter-spacing:.02em}
.pill{font-size:13px;font-weight:700;border-radius:99px;padding:5px 10px;background:var(--fundo);color:var(--cinza);white-space:nowrap}
.pill.on{background:var(--okbg);color:var(--ok)}
.t2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px}
h1{font:700 30px/1 var(--sign);color:var(--placa);margin:0}
.date{border:2px solid var(--linha);background:#fff;border-radius:10px;padding:6px 8px;font-size:16px;min-height:42px;color:var(--asf)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{border:2px solid var(--linha);background:#fff;border-radius:12px;padding:8px 6px;min-height:46px;font-weight:700;font-size:15px;color:var(--cinza);line-height:1.15}
.seg button.on{background:var(--placa);border-color:var(--placa);color:#fff}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 100px);max-width:720px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats button{width:100%;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:8px 12px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stats b{font:700 28px/1 var(--sign);color:var(--placa)}
.stats span{font-size:13px;color:var(--cinza);font-weight:600}
.stats button:active{background:var(--fundo)}.stats .pb b{color:var(--warn)}
.bar{height:6px;background:var(--linha);border-radius:9px;overflow:hidden;margin:-2px 2px 12px}
.bar i{display:block;height:100%;background:var(--az);width:0;transition:width .3s}
.gps{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:10px;font-size:15px;color:var(--cinza)}
.btn{appearance:none;border:2px solid var(--asf);background:#fff;color:var(--asf);border-radius:12px;padding:10px 14px;min-height:46px;font-weight:700}
.btn.pri{background:var(--az);border-color:var(--az);color:#fff}
.btn.esc{background:var(--placa);border-color:var(--placa);color:#fff}
.near{background:var(--placa);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px rgba(11,90,138,.25);border-left:8px solid var(--az)}
.near small{font-size:14px;opacity:.85}
.near .big{font:700 34px/1.05 var(--sign);margin:4px 0 12px}
.ncs{display:grid;gap:8px}
.nc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;width:100%;text-align:left;border:0;border-radius:14px;background:#fff;color:var(--asf);padding:12px}
.nc .nl{grid-row:span 3;width:52px;height:52px;border-radius:12px;background:var(--az);color:#fff;display:grid;place-items:center;font:700 26px var(--sign)}
.nc.ok .nl{background:var(--ok)}.nc.prob .nl{background:var(--warn)}
.nd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nd span{font:700 20px/1.1 var(--sign);color:var(--placa)}
.nd i{display:block;font:600 11px system-ui,sans-serif;color:var(--cinza);font-style:normal}
.ns{font-size:14px;font-weight:600;color:var(--cinza)}
.nc.prob .ns,.ns:has(+.nb){}
.nb{font-size:15px;font-weight:800;color:var(--az)}
.near .go{display:flex;gap:8px;flex-wrap:wrap}
.near .go button{flex:1 1 130px;border:0;border-radius:12px;padding:12px;font-size:18px;font-weight:800;background:#fff;color:var(--placa);min-height:54px}
.near .go button.done{background:rgba(255,255,255,.16);color:#fff}
.tools{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font-size:15px;min-height:42px;padding:7px 14px;border-radius:999px;border:2px solid var(--linha);background:#fff;color:var(--asf);font-weight:600}
.chip.on{background:var(--az);border-color:var(--placa);color:#fff;font-weight:700}
.list{display:grid;gap:10px}
.grp{background:#fff;border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px 4px}
.gh b{font:700 24px var(--sign);color:var(--placa)}
.gh span{font-size:14px;color:var(--cinza);white-space:nowrap}
.gh span strong{color:var(--asf);font-size:16px}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--linha);background:none;text-align:left;padding:10px 14px;min-height:62px}
.gh+.row{border-top:0}
.lt{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 22px var(--sign);background:var(--fundo);color:var(--placa)}
.lt.sm{font-size:14px}
.row.ok .lt{background:var(--ok);color:#fff}.row.prob .lt{background:var(--warn);color:#fff}
.row .tx{font-size:15px;color:var(--cinza);line-height:1.35}
.row .tx b{color:var(--asf)}.row .tx small{font-size:13px;color:var(--cinza)}
.row .go{font-size:24px;color:var(--az);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--warnbg);color:var(--warn);margin-right:4px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.empty{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:22px;text-align:center;color:var(--cinza)}
details.out{margin-top:16px}
details.out summary{padding:12px 4px;color:var(--cinza);font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--placa);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;z-index:4;justify-content:center}
.foot .btn{flex:1;max-width:200px;border-color:#fff;padding:10px 8px}
.foot .btn.pri{border-color:var(--az)}
.sheet{position:fixed;inset:0;background:var(--fundo);z-index:10;overflow-y:auto;display:none;padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}
.sheet.open{display:block}
.shead{background:#fff;border-bottom:4px solid var(--az);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px}
.shead h2{margin:0;font:700 28px var(--sign);color:var(--placa);flex:1}
.shead button{border:2px solid var(--linha);background:#fff;border-radius:12px;min-height:46px;padding:0 12px;font-weight:700;color:var(--placa)}
.shead #sdist{font-size:14px;color:var(--cinza)}
.sbody{padding:12px;max-width:720px;margin:auto;display:grid;gap:12px}
.box{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:14px}
.box h3{margin:0 0 10px;font:700 15px var(--sign);color:var(--placa);text-transform:none}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.ref div{background:var(--fundo);border-radius:10px;padding:8px 10px}
.ref span{display:block;font-size:12px;color:var(--cinza);font-weight:600}
.ref strong{font:700 20px var(--sign)}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist td,.hist th{padding:6px 4px;border-top:1px solid var(--linha);text-align:right;white-space:nowrap}
.hist th{color:var(--cinza);font-weight:600;border:0}.hist td:first-child,.hist th:first-child{text-align:left}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.st button{border:2px solid var(--linha);background:#fff;border-radius:12px;min-height:48px;font-weight:700;font-size:15px}
.st button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.on.pb{background:var(--warn);border-color:var(--warn);color:#fff}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:14px;color:var(--cinza);margin-bottom:4px;font-weight:700}
label.f input,textarea{width:100%;border:2px solid var(--linha);background:#fff;border-radius:12px;padding:10px 14px;font:700 28px var(--sign);min-height:58px;color:var(--asf)}
label.f input::placeholder{color:#a9b6bf;font-weight:400;font-size:18px}
label.f input:focus,textarea:focus{outline:none;border-color:var(--az);box-shadow:0 0 0 3px rgba(43,159,211,.25)}
label.f.small input{font-size:20px;min-height:48px}
textarea{font:400 17px system-ui,sans-serif;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{display:flex;gap:8px;flex-wrap:wrap;font-size:15px;margin-bottom:8px}
.calc div{background:var(--fundo);border-radius:10px;padding:6px 10px}
.ruc{display:grid;grid-template-columns:1.1fr 1.1fr 1fr;gap:8px;margin:0 0 12px}
.ruc div{background:var(--fundo);border-radius:12px;padding:10px}
.ruc div:first-child{background:var(--az);color:#fff}
.ruc span{display:block;font-size:12px;font-weight:600;opacity:.85}
.ruc strong{font:700 30px/1.1 var(--sign)}
.msg{border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.msg.w{background:var(--warnbg);color:var(--warn)}.msg.b{background:var(--badbg);color:var(--bad)}
.sfoot{position:fixed;left:0;right:0;bottom:0;background:var(--placa);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;z-index:11}
.sfoot .btn{flex:1;min-height:54px;font-size:17px;white-space:nowrap;border-color:#fff}.sfoot .pri{flex:1.6;border-color:var(--az)}
summary{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(8,63,97,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);width:100%;max-width:720px;display:grid;gap:10px;border-top:4px solid var(--az)}
.mbox h3{margin:0;font:700 22px var(--sign);color:var(--placa)}
.mbox .btn{width:100%;min-height:52px;text-align:left}
.mbox p{margin:0;color:var(--cinza);font-size:15px}
.map{position:relative;height:250px;border-radius:12px;overflow:hidden;background:#dfe8ee;border:1px solid var(--linha)}
.map.big{height:calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:0;border:0}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;background:rgba(8,63,97,.92);border:2px solid #fff;border-radius:12px;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.4);white-space:nowrap;font-family:var(--sign)}
.mk b{color:#fff;font-size:14px;padding:0 4px 0 3px}
.mk span{min-width:30px;height:30px;border-radius:8px;background:#fff;color:var(--placa);display:grid;place-items:center;font-weight:700;font-size:15px;padding:0 4px}
.mk span.ok{background:#2E7D4F;color:#fff}.mk span.prob{background:#F0A500;color:#1b1200}
.mk span.alvo{outline:3px solid #2B9FD3;outline-offset:1px}
.mk.alvo{background:#2B9FD3;z-index:1000}
.mapsc{padding-bottom:0}
.mleg{margin:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);font-size:13px;color:var(--cinza);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:#fff}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--placa);margin-right:3px;vertical-align:-1px}
.d.ok{background:var(--ok);border-color:#fff}.d.pb{background:var(--warn);border-color:#fff}.d.me{background:#1a73e8;border-color:#fff;box-shadow:0 0 0 2px #1a73e8}
.lbl{background:rgba(255,255,255,.92)!important;border:0!important;box-shadow:none!important;font:700 12px var(--sign)!important;color:var(--placa)!important;padding:1px 4px!important;border-radius:5px!important}
.lbl:before{display:none}
.maplinks{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.maplinks a{flex:1 1 90px;text-align:center;text-decoration:none;font-size:15px;padding:10px 6px;min-height:44px}
.trava{position:fixed;inset:0;z-index:50;background:var(--fundo);display:grid;place-items:center;padding:20px}
.trava[hidden]{display:none}
.tbox{background:#fff;border:1px solid var(--linha);border-top:4px solid var(--az);border-radius:18px;padding:22px;width:100%;max-width:400px;display:grid;gap:12px}
.tbox h1{margin:4px 0 0}.tbox p{margin:0;color:var(--cinza);font-size:15px}
.tbox label.f input{font:600 20px system-ui,sans-serif;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--placa-esc);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="trava" class="trava" hidden>
  <div class="tbox">
    <img class="logo" src="https://static.wixstatic.com/media/bd40cc_257e0fc23f794f808a9e45057b28eb8c~mv2.png/v1/fill/w_240,h_72,al_c,q_90/logo.png" alt="ENG Consultoria" onerror="this.outerHTML='<span class=logot>ENG Consultoria</span>'">
    <h1>Piezômetros</h1>
    <p>Digite a senha para liberar os dados. Neste aparelho ela só é pedida uma vez.</p>
    <form id="tform"><label class="f"><span>Senha</span><input id="tsenha" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false"></label>
    <button class="btn pri" style="width:100%;min-height:54px">Entrar</button></form>
    <p id="terro" class="msg b" hidden>Senha incorreta.</p>
  </div>
</div>
<header>
  <div class="hd"><img class="logo" src="https://static.wixstatic.com/media/bd40cc_257e0fc23f794f808a9e45057b28eb8c~mv2.png/v1/fill/w_240,h_72,al_c,q_90/logo.png" alt="ENG Consultoria" onerror="this.outerHTML='<span class=logot>ENG Consultoria</span>'"><span class="pill" id="gpill">GPS desligado</span></div>
  <div class="t2"><h1>Piezômetros</h1><input type="date" id="dt" class="date" aria-label="Data da campanha"></div>
  <div class="seg" id="seg"></div>
</header>
<main>
  <div class="stats"><button data-v="ok"><b id="nfeito" class="num">0</b><span>Lidos</span></button><button data-v="falta"><b id="nfalta" class="num">0</b><span>Faltam</span></button><button class="pb" data-v="prob"><b id="nprob" class="num">0</b><span>Problema</span></button></div>
  <div class="bar"><i id="pbar"></i></div>
  <div class="gps"><span id="gtxt">Ligue o GPS para achar o piezômetro mais perto</span><button class="btn esc" id="gbtn">Ativar GPS</button></div>
  <div id="near"></div>
  <div class="tools">
    <div class="chips" id="flt">
      <button class="chip on" data-f="falta">Faltam</button><button class="chip" data-f="feito">Feitos</button><button class="chip" data-f="todos">Todos</button>
    </div>
    <button class="chip" id="ord" style="margin-left:auto">↕ Nº</button>
  </div>
  <div class="list" id="list"></div>
  <details class="out" id="outw"><summary id="outs"></summary><div class="list" id="outl"></div></details>
</main>
<div class="foot"><button class="btn pri" id="bexp">Exportar</button><button class="btn" id="bmapa">Mapa</button><button class="btn" id="bmais">Mais…</button></div>
<section class="sheet mapsc" id="mapsc" role="dialog" aria-modal="true">
  <div class="shead"><button id="mx">‹ Lista</button><h2>Mapa</h2><span id="mdist" class="num"></span></div>
  <div id="gmap" class="map big"></div>
  <p class="mleg"><i class="d me"></i>Você <i class="d"></i>Falta <i class="d ok"></i>Lido <i class="d pb"></i>Problema · toque num ponto para abrir a ficha</p>
</section>

<section class="sheet" id="lst" aria-modal="true" role="dialog">
  <div class="shead"><button id="lx">‹ Voltar</button><h2 id="ltit"></h2></div>
  <div class="sbody"><p id="lsub" style="margin:0;color:var(--cinza);font-size:15px"></p><div class="list" id="llist"></div></div>
</section>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="shead"><button id="sx" aria-label="Voltar">‹ Lista</button><h2 id="sname"></h2><span id="sdist" class="num" style="font-size:15px;opacity:.85"></span></div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot"><button class="btn" id="ssave">Salvar</button><button class="btn pri" id="snext">Salvar e próximo ›</button></div>
</section>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

{const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const abre=async raw=>{const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(CIFRA.iv)},k,u8(CIFRA.ct));return JSON.parse(new TextDecoder().decode(pt))};
const deriva=async senha=>{const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(CIFRA.salt),iterations:CIFRA.it},b,256))};
const b64=a=>btoa(String.fromCharCode(...a));

function app(){
const ST=['Lido','Obstruído','Seco','Sedimentado','Danificado','Sem acesso','Não localizado'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const F=(n,d=2)=>n==null||n===''||isNaN(n)?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:d,useGrouping:false});
const FX=(n,d)=>n==null||n===''||isNaN(n)?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const FRU=n=>FX(n,2),FG=n=>FX(n,3),FL=n=>FX(n,2);
const FD=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const hoje=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const KEY='piezo-campo-v1';
let S={site:'VECP',ord:'num',flt:'falta',camp:{},refLocal:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar no aparelho')}};
const camp=()=>S.camp[S.site]||(S.camp[S.site]={data:hoje(),lei:{}});
let pos=null,watch=null,cur=null;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const pzs=()=>DADOS[S.site].pzs;
const byId=id=>pzs().find(p=>p.id===id);
const numOf=id=>parseInt(id.match(/\d+/)[0]);
function ref(p){ // referência: leitura do mês anterior (local se houver, senão planilha)
  const l=(S.refLocal[S.site]||{})[p.id];
  const ultPlan=(p.hist&&p.hist.length)?p.hist[p.hist.length-1].data:'';
  if(l&&(l.campData||l.data||'')>=(p._planUlt||ultPlan))return l;
  if(p.tipo==='eletrico'){const h=p.hist[p.hist.length-1];return h?{data:h.data,dg:h.dg,temp:h.temp,kpa:h.kpa,sal:h.sal,tot:h.tot,cam:h.cam,obs:h.obs,status:'Lido'}:null}
  const h=p.hist[p.hist.length-1];
  const lidoUlt=h&&typeof h.lix==='number';
  return {data:p.ultimaValida,...(p.ref||{}),status:lidoUlt?'Lido':(h&&h.obs?cap(h.obs):'Sem leitura'),campData:h&&h.data,obs:h&&h.obs};
}
const cap=s=>String(s).charAt(0)+String(s).slice(1).toLowerCase();
function dist(a,b){const R=6371e3,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function rumo(a,b){const t=x=>x*Math.PI/180;const y=Math.sin(t(b[1]-a[1]))*Math.cos(t(b[0])),x=Math.cos(t(a[0]))*Math.sin(t(b[0]))-Math.sin(t(a[0]))*Math.cos(t(b[0]))*Math.cos(t(b[1]-a[1]));const g=(Math.atan2(y,x)*180/Math.PI+360)%360;return ['N','NE','L','SE','S','SO','O','NO'][Math.round(g/45)%8]}
const dOf=p=>pos&&p.geo?dist(pos,p.geo):null;
const fm=m=>m==null?'':m<1000?Math.round(m)+' m':F(m/1000,1)+' km';

function calc(p,v,r){ // retorna {ru,kpa,mca,cs}
  const o={};
  if(p.tipo==='eletrico'){const R=P(v.dg),T=P(v.temp),cam=P(v.cam)??r?.cam;
    if(R!=null&&T!=null){o.kpa=p.G*(R-p.R0)+p.K*(T-p.T0);o.mca=o.kpa/9.80665;if(cam)o.ru=o.mca/cam}
    return o}
  const lix=P(v.lix),sal=P(v.sal)??r?.sal,cam=P(v.cam)??r?.cam;
  if(sal!=null&&cam!=null)o.cs=sal+cam;
  if(lix!=null&&o.cs){const den=p.ruMode==='B'?cam:o.cs;o.ru=Math.max(0,(o.cs-lix)/den)}
  return o;
}
function refRu(p,r){if(!r)return null;if(r.ru!=null)return r.ru;const c=calc(p,r,r);return c.ru??null}
function estado(p){const l=camp().lei[p.id];if(!l||!l.status)return '';return l.status==='Lido'?'ok':'prob'}

function render(){
  const d=DADOS[S.site],c=camp();
  $('seg').innerHTML=Object.keys(DADOS).map(k=>`<button class="${k===S.site?'on':''}" data-s="${k}">${esc(DADOS[k].nome.replace('Ecoparque ',''))}</button>`).join('');
  $('dt').value=c.data;
  const at=pzs().filter(p=>p.ativo),feitos=at.filter(p=>estado(p)).length;
  $('pbar').style.width=(at.length?feitos/at.length*100:0)+'%';
  $('nfeito').textContent=at.filter(p=>estado(p)==='ok').length;$('nfalta').textContent=at.length-feitos;$('nprob').textContent=at.filter(p=>estado(p)==='prob').length;
  document.querySelectorAll('#flt .chip').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flt));
  $('ord').textContent=S.ord==='num'?'↕ Nº':'↕ Perto';
  let L=at.filter(p=>S.flt==='todos'||(S.flt==='falta'?!estado(p):estado(p)));
  const srt=a=>a.sort((x,y)=>S.ord==='perto'&&pos?((dOf(x)??1e9)-(dOf(y)??1e9))||x.id.localeCompare(y.id,'pt',{numeric:true}):x.id.localeCompare(y.id,'pt',{numeric:true}));
  srt(L);
  $('list').innerHTML=L.length?grupos(L):`<div class="empty">${S.flt==='falta'?'Todos os piezômetros da rotina foram preenchidos.':'Nada aqui ainda.'}</div>`;
  const out=srt(pzs().filter(p=>!p.ativo));
  $('outw').style.display=out.length?'':'none';
  $('outs').textContent=`Fora da rotina (${out.length}) — sem leitura na última campanha`;
  $('outl').innerHTML=grupos(out);
  renderNear();
}
function letra(id){const x=id.replace(/^PZ\s*0*\d+/i,'').replace(/[\s-]/g,'');if(/\(e\)/i.test(x))return ['El.',1];return [x||'•',0]}
function grupos(L){const G=[];for(const p of L){const k=numOf(p.id)+(p.tipo==='eletrico'?'e':'');let g=G.find(x=>x.k===k);if(!g)G.push(g={k,ps:[]});g.ps.push(p)}
  return G.map(g=>{const p0=g.ps[0],dd=dOf(p0);const nome='PZ '+String(numOf(p0.id)).padStart(2,'0')+(p0.tipo==='eletrico'?' (e)':'');
    return `<div class="grp"><div class="gh"><b>${esc(nome)}</b><span class="num">${dd!=null?`<strong>${fm(dd)}</strong> ${rumo(pos,p0.geo)}`:''}</span></div>${g.ps.map(row).join('')}</div>`}).join('')}
function row(p){
  const r=ref(p),l=camp().lei[p.id],e=estado(p),[lt,sm]=letra(p.id);
  let tx;
  if(l&&l.status){tx=l.status==='Lido'?(p.tipo==='eletrico'?`<span class="tag ok">Hoje</span><b>DG ${F(P(l.dg),1)}</b> · ru <b>${FRU(calc(p,l,r).ru)}</b>`:`<span class="tag ok">Hoje</span>RF <b>${FL(P(l.lix))}</b> · RA <b>${FL(P(l.ra))}</b> · ru <b>${FRU(calc(p,l,r).ru)}</b>`):`<span class="tag">${esc(l.status)}</span>${esc(l.obs||'')}`}

const MASC={i_lix:2,i_ra:2,i_gas:1}; // dígitos antes da vírgula
function mascara(el){const n=MASC[el.id];if(!n)return;
  let d=el.value.replace(/\D/g,'');const mx=n===1?3:2;d=d.slice(0,n+mx);
  el.value=d.length>n?d.slice(0,n)+','+d.slice(n):d;}
function lerForm(){
  const g=id=>{const e=$(id);return e?e.value.trim():''};
  const sb=$('st').querySelector('.on');
  return {status:sb?sb.dataset.s:'',dg:g('i_dg'),temp:g('i_temp'),lix:g('i_lix'),ra:g('i_ra'),gas:g('i_gas'),sal:g('i_sal'),tot:g('i_tot'),cam:g('i_cam'),obs:g('i_obs')};
}
function atual(){
  const p=cur,r=ref(p),v=lerForm(),c=calc(p,v,r),al=[];
  const temValor=p.tipo==='eletrico'?(v.dg||v.temp):v.lix;
  if(temValor&&!v.status){$('st').querySelector('[data-s="Lido"]').classList.add('on');v.status='Lido'}
  $('medbox').style.opacity=v.status&&v.status!=='Lido'&&!temValor?.55:1;
  let h='';
  if(p.tipo==='eletrico'){if(c.kpa!=null)h=`<div>Pressão <b>${F(c.kpa,2)} kPa</b></div><div><b>${F(c.mca,3)}</b> mca</div><div>ru <b>${FRU(c.ru)}</b></div>`;
    const R=P(v.dg);if(R!=null&&r&&r.dg!=null&&Math.abs(R-r.dg)>50)al.push(['w',`DG mudou ${F(R-r.dg,1)} em relação ao mês anterior — confira.`]);}
  else{const lix=P(v.lix),tot=P(v.tot);
    if(lix!=null){if(c.ru!=null)h=`<div>ru <b>${FRU(c.ru)}</b></div>`;
      if(r&&r.lix!=null){const df=lix-r.lix;h+=`<div>Variação <b>${df>0?'+':''}${FL(df)} m</b></div>`;if(Math.abs(df)>=1)al.push(['w',`Variação de ${FL(Math.abs(df))} m em relação ao mês anterior — confira a leitura.`])}
      const ra=P(v.ra);if(ra!=null&&Math.abs(ra-lix)>=1)al.push(['w',`RA e RF diferem ${FL(Math.abs(ra-lix))} m — confira.`]);
      if(tot!=null&&lix>tot)al.push(['b','Lixiviado maior que a profundidade total do piezômetro.'])}
    const gs=P(v.gas);if(gs!=null&&gs>2)al.push(['w','Pressão de gás alta — confira a unidade (kgf/cm²).'])}
  const ruA=refRu(p,r);
  $('rubox').innerHTML=`<div class="ruc"><div><span>ru atual</span><strong class="num">${c.ru!=null?FRU(c.ru):'—'}</strong></div><div><span>ru anterior</span><strong class="num">${ruA!=null?FRU(ruA):'—'}</strong></div><div><span>Diferença</span><strong class="num">${c.ru!=null&&ruA!=null?(Math.abs(c.ru-ruA)<0.005?'0,00':((c.ru-ruA)>0?'+':'')+FRU(c.ru-ruA)):'—'}</strong></div></div>`;
  h=h.replace(/<div>ru <b>.*?<\/b><\/div>/,'');
  if(c.ru!=null&&ruA!=null&&Math.abs(c.ru-ruA)>=0.1)al.push(['w',`ru mudou ${FRU(c.ru-ruA)} em relação ao mês anterior — confira.`]);
  $('calc').innerHTML=h;
  $('alerta').innerHTML=al.map(a=>`<div class="msg ${a[0]}">${esc(a[1])}</div>`).join('');
}
function salvar(){
  const v=lerForm();
  const temValor=cur.tipo==='eletrico'?(v.dg||v.temp):v.lix;
  if(!v.status&&!temValor&&!v.obs){toast('Nada preenchido');return false}
  if(!v.status)v.status='Lido';
  if(v.status==='Lido'&&!temValor){toast('Preencha a leitura ou escolha a situação');return false}
  const d=new Date();v.hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(pos)v.gps=pos.map(x=>+x.toFixed(6));
  camp().lei[cur.id]=v;save();toast(cur.id+' salvo');return true;
}

function proximo(){
  const at=pzs().filter(p=>p.ativo&&!estado(p)&&p!==cur);
  if(!at.length){toast('Rotina completa!');return null}
  if(pos)at.sort((a,b)=>(dOf(a)??1e9)-(dOf(b)??1e9));
  else{const n=cur?cur.id:'';const dep=at.filter(p=>p.id.localeCompare(n,'pt',{numeric:true})>0);if(dep.length)return dep.sort((a,b)=>a.id.localeCompare(b.id,'pt',{numeric:true}))[0]}
  return pos?at[0]:at.sort((a,b)=>a.id.localeCompare(b.id,'pt',{numeric:true}))[0];
}

function linhas(site){
  const c=S.camp[site];if(!c)return[];const out=[];
  for(const p of DADOS[site].pzs){const l=c.lei[p.id];if(!l)continue;const r=ref(p);
    const cc=calc(p,l,r);
    out.push({pz:p.id,tipo:p.tipo,data:c.data,status:l.status,dg:P(l.dg),temp:P(l.temp),kpa:cc.kpa,mca:cc.mca,lix:P(l.lix),ra:P(l.ra),gas:P(l.gas),sal:P(l.sal),tot:P(l.tot),cam:P(l.cam),cs:cc.cs,ru:cc.ru,obs:l.obs,hora:l.hora,gps:l.gps?l.gps.join(' '):''})}
  return out;
}
const n2f=(x,d)=>x==null?'':x.toFixed(d).replace('.',',');
const n2=(x,d=3)=>x==null?'':String(+x.toFixed(d)).replace('.',',');
function csv(){
  const site=S.site,L=linhas(site);
  const H=['Aterro','Piezômetro','Data','Situação','Registro','Lixiviado RF (m)','Lixiviado RA (m)','Pressão gás (kgf/cm²)','Altura saliência (m)','Profundidade total (m)','Profundidade câmara (m)','Câmara + saliência (m)','DG Reading','Temperatura (°C)','Pressão (kPa)','Pressão (mca)','ru','Observações','Hora','GPS'];
  const rows=L.map(x=>[DADOS[site].nome,x.pz,FD(x.data).replace(/\/(\d\d)$/,'/20$1'),x.status,x.tipo==='padrao'?'RF':'',n2f(x.lix,2),n2f(x.ra,2),n2f(x.gas,3),n2(x.sal,2),n2(x.tot,2),n2(x.cam,2),n2(x.cs,2),n2(x.dg,1),n2(x.temp,1),n2(x.kpa,3),n2(x.mca,4),n2f(x.ru,2),x.status!=='Lido'?[x.status.toUpperCase(),x.obs].filter(Boolean).join(' - '):(x.obs||''),x.hora||'',x.gps]);
  return '﻿'+[H,...rows].map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\r\n');
}
function tsv(){ // na ordem das colunas da planilha (por aba)
  const L=linhas(S.site);

    ?[x.pz,FD(x.data),n2(x.dg,1),n2(x.temp,1),n2(x.sal,2),n2(x.tot,2),x.status!=='Lido'?x.status.toUpperCase():(x.obs||'')].join('\t')
    :[x.pz,FD(x.data),'RF',x.status==='Lido'?n2f(x.lix,2):'',x.status==='Lido'?n2f(x.gas,3):'',n2(x.sal,2),n2(x.tot,2),x.status!=='Lido'?[x.status.toUpperCase(),x.obs].filter(Boolean).join(' - '):(x.obs||'')].join('\t')+'\n'+['','','RA',x.status==='Lido'?n2f(x.ra,2):''].join('\t')).join('\n');
}

      else rl[id]={...(r||{}),status:l.status,campData:c.data,obs:l.obs};
      p.hist=[...(p.hist||[]),{data:c.data,lix:P(l.lix),ra:P(l.ra),gas:P(l.gas),dg:P(l.dg),temp:P(l.temp),ru:calc(p,l,r).ru,kpa:calc(p,l,r).kpa,obs:l.status!=='Lido'?l.status:l.obs}].slice(-3);
      S.hist=S.hist||{};(S.hist[S.site]=S.hist[S.site]||{})[id]=p.hist}
    S.camp[S.site]={data:hoje(),lei:{}};save();fecharM();render();toast('Nova campanha iniciada')}
  if(a==='limpar')modal(`<h3>Apagar leituras?</h3><p>Isso apaga as leituras de ${FD(camp().data)} de ${esc(DADOS[S.site].nome)} neste aparelho.</p><button class="btn" style="color:var(--bad)" data-a="limpar2">Apagar</button><button class="btn" data-a="x">Cancelar</button>`);
  if(a==='bloquear'){try{localStorage.removeItem('piezo-chave');localStorage.removeItem('piezo-dados')}catch(e){}location.reload()}
  if(a==='limpar2'){camp().lei={};save();fecharM();render()}
};
// histórico local de campanhas anteriores
for(const k in DADOS)for(const p of DADOS[k].pzs)p._planUlt=p.hist&&p.hist.length?p.hist[p.hist.length-1].data:'';
if(S.hist)for(const[site,o]of Object.entries(S.hist))for(const[id,h]of Object.entries(o)){const p=DADOS[site]?.pzs.find(x=>x.id===id);if(p&&h.length&&h[h.length-1].data>=p._planUlt)p.hist=h}
// coordenadas importadas
const ex=document.createElement('input');ex.type='file';ex.id='kf';ex.accept='.kml,.xml,application/vnd.google-earth.kml+xml';ex.hidden=true;document.body.appendChild(ex);
ex.onchange=async()=>{const f=ex.files[0];if(!f)return;try{const x=new DOMParser().parseFromString(await f.text(),'text/xml');let n=0;
  for(const pm of x.getElementsByTagName('Placemark')){const nm=pm.getElementsByTagName('name')[0]?.textContent||'',co=pm.getElementsByTagName('coordinates')[0]?.textContent.trim().split(/\s+/)[0];if(!co)continue;const m=nm.match(/\d+/);if(!m)continue;const[lo,la]=co.split(',').map(Number);
    for(const p of pzs())if(numOf(p.id)===+m[0]){p.geo=[la,lo];n++;(S.geo=S.geo||{})[S.site+'|'+p.id]=p.geo}}
  save();render();toast(n+' piezômetro(s) com coordenada')}catch(e){toast('Não consegui ler o KML')}ex.value=''};
if(S.geo)for(const[k,g]of Object.entries(S.geo)){const[s,id]=k.split('|');const p=DADOS[s]?.pzs.find(x=>x.id===id);if(p)p.geo=g}

/* mapa: satélite (Leaflet) quando disponível; croqui offline em SVG quando não */
const TILE='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
let LP=null;const MAPAS=[];
function carregaLeaflet(){if(window.L)return Promise.resolve();if(LP)return LP;
  LP=new Promise((ok,ko)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
    const j=document.createElement('script');j.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';j.onload=()=>ok();j.onerror=()=>{LP=null;ko()};document.head.appendChild(j);setTimeout(()=>{if(!window.L){LP=null;ko()}},6000)});return LP}
const corPZ=p=>{const e=estado(p);return e==='ok'?'#2E7D4F':e==='prob'?'#9A6A00':'#fff'};
async function desenhaMapa(el,alvo){
  for(let i=MAPAS.length-1;i>=0;i--)if(!document.body.contains(MAPAS[i].el)||MAPAS[i].el===el){try{MAPAS[i].m&&MAPAS[i].m.remove()}catch(e){}MAPAS.splice(i,1)}
  const ps=pzs().filter(p=>p.geo&&(p.ativo||p.id===alvo));const reg={el,alvo};MAPAS.push(reg);
  try{await carregaLeaflet();}catch(e){reg.svg=true;svgMapa(reg);return}
  if(!document.body.contains(el))return;
  el.innerHTML='';const m=L.map(el,{zoomControl:true,attributionControl:false,maxZoom:20});reg.m=m;
  L.tileLayer(TILE,{maxZoom:20,maxNativeZoom:19}).addTo(m);
  const G={};for(const p of ps){const k=p.geo.join();(G[k]=G[k]||[]).push(p)}
  for(const g of Object.values(G)){const temAlvo=g.some(p=>p.id===alvo);
    const num=String(numOf(g[0].id)).padStart(2,'0')+(g[0].tipo==='eletrico'?'e':'');
    const html=`<div class="mk ${temAlvo?'alvo':''}"><b>${esc(num)}</b>${g.map(p=>{const[lt]=letra(p.id);return `<span data-id="${esc(p.id)}" class="${estado(p)} ${p.id===alvo?'alvo':''}">${esc(p.tipo==='eletrico'?'El':(lt==='•'?'Ler':lt))}</span>`}).join('')}</div>`;
    const mk=L.marker(g[0].geo,{icon:L.divIcon({className:'',html,iconSize:null}),zIndexOffset:temAlvo?1000:0}).addTo(m);
    mk.on('click',ev=>{const t=ev.originalEvent&&ev.originalEvent.target&&ev.originalEvent.target.closest&&ev.originalEvent.target.closest('[data-id]');const id=t?t.dataset.id:g[0].id;
      if(alvo&&id===alvo)return;if(alvo)abrir(id,false);else{fechaMapa();abrir(id)}});}
  reg.me=L.circleMarker([0,0],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1});reg.line=L.polyline([],{color:'#2B9FD3',weight:3,dashArray:'6 6'});
  atualizaMapa(reg,true);
}
function atualizaMapa(reg,fit){
  if(reg.svg){svgMapa(reg);return}const m=reg.m;if(!m)return;
  const alvo=reg.alvo&&byId(reg.alvo);
  if(pos){reg.me.setLatLng(pos).addTo(m);if(alvo){reg.line.setLatLngs([pos,alvo.geo]).addTo(m)}}
  if(fit){const pts=alvo?(pos&&dist(pos,alvo.geo)<1500?[pos,alvo.geo]:[alvo.geo]):pzs().filter(p=>p.geo&&p.ativo).map(p=>p.geo).concat(pos&&pzs().some(p=>p.geo&&dist(pos,p.geo)<1500)?[pos]:[]);
    if(pts.length===1)m.setView(pts[0],18);else m.fitBounds(pts,{padding:[30,30],maxZoom:19})}
  if(reg.el.id==='gmap'||reg.el.id==='fmap'){const t=alvo||null;if(t&&pos){const d=dist(pos,t.geo);(reg.el.id==='gmap'?$('mdist'):$('sdist')).textContent=fm(d)+' '+rumo(pos,t.geo)}}
}
function atualizaMapas(){for(const r of MAPAS)if(document.body.contains(r.el))atualizaMapa(r,false)}
function svgMapa(reg){ // croqui sem internet
  const el=reg.el,W=el.clientWidth||340,H=el.clientHeight||250,ps=pzs().filter(p=>p.geo&&(p.ativo||p.id===reg.alvo));
  const pts=ps.map(p=>p.geo);if(pos&&pts.some(g=>dist(pos,g)<1500))pts.push(pos);
  const la=pts.map(g=>g[0]),lo=pts.map(g=>g[1]),k=Math.cos(la[0]*Math.PI/180);
  const x0=Math.min(...lo),x1=Math.max(...lo),y0=Math.min(...la),y1=Math.max(...la);
  const sc=Math.min((W-60)/((x1-x0)*k||1e-9),(H-40)/((y1-y0)||1e-9));
  const X=g=>30+(g[1]-x0)*k*sc+((W-60)-(x1-x0)*k*sc)/2,Y=g=>20+(y1-g[0])*sc+((H-40)-(y1-y0)*sc)/2;
  const alvo=reg.alvo&&byId(reg.alvo);let h='';
  if(alvo&&pos)h+=`<line x1="${X(pos)}" y1="${Y(pos)}" x2="${X(alvo.geo)}" y2="${Y(alvo.geo)}" stroke="#2B9FD3" stroke-width="3" stroke-dasharray="6 6"/>`;
  const tot={},vistos={};for(const p of ps){const k2=p.geo.join();tot[k2]=(tot[k2]||0)+1}
  let lb='',top='';
  for(const p of ps){const k2=p.geo.join(),n=(vistos[k2]=(vistos[k2]||0)+1);const a=p.id===reg.alvo,x=X(p.geo)+(n-1)*9,y=Y(p.geo);
    const c=`<g data-id="${esc(p.id)}"><circle cx="${x}" cy="${y}" r="${a?10:7}" fill="${corPZ(p)}" stroke="${a?'#2B9FD3':'#0B5A8A'}" stroke-width="${a?4:2}"/></g>`;
    if(a)top+=c;else h+=c;
    if(n===1||a){const tx=X(p.geo)+(tot[k2]-1)*9+(a?14:11);const t=a?p.id.replace(/^PZ\s*/,''):p.id.replace(/^PZ\s*0*/,'').replace(/\s*\(e\).*$/,'e').replace(/[-\s]?[AB]$/,'');
      lb+=`<text x="${tx}" y="${y+4}" font-size="${a?14:11}" font-weight="700" fill="${a?'#083F61':'#0B5A8A'}" stroke="#eef3f6" stroke-width="3" paint-order="stroke">${esc(t)}</text>`}}
  h+=top+lb;
  if(pos&&pts.includes(pos))h+=`<circle cx="${X(pos)}" cy="${Y(pos)}" r="8" fill="#1a73e8" stroke="#fff" stroke-width="3"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${h}</svg><span style="position:absolute;left:6px;top:6px;font-size:11px;color:#5E6B74;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px">Sem internet: croqui, sem satélite</span>`;
  if(!reg.alvo)el.querySelector('svg').onclick=e=>{const g=e.target.closest('g[data-id]');if(g){fechaMapa();abrir(g.dataset.id)}};
}
function abreMapa(){$('mapsc').classList.add('open');history.pushState({m:1},'');desenhaMapa($('gmap'),null)}
function fechaMapa(){if($('mapsc').classList.contains('open')){$('mapsc').classList.remove('open');for(const r of MAPAS)if(r.el.id==='gmap'){try{r.m&&r.m.remove()}catch(e){}}}}
$('bmapa').onclick=abreMapa;$('mx').onclick=()=>history.back();
async function baixarMapa(){ // guarda as imagens de satélite do aterro para usar sem internet
  const g=pzs().filter(p=>p.geo).map(p=>p.geo);if(!g.length)return;
  const la0=Math.min(...g.map(x=>x[0]))-0.002,la1=Math.max(...g.map(x=>x[0]))+0.002,lo0=Math.min(...g.map(x=>x[1]))-0.002,lo1=Math.max(...g.map(x=>x[1]))+0.002;
  const tx=(lo,z)=>Math.floor((lo+180)/360*2**z),ty=(la,z)=>{const r=la*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z)};
  const urls=[];for(let z=15;z<=19;z++)for(let x=tx(lo0,z);x<=tx(lo1,z);x++)for(let y=ty(la1,z);y<=ty(la0,z);y++)urls.push(TILE.replace('{z}',z).replace('{x}',x).replace('{y}',y));
  try{await carregaLeaflet()}catch(e){toast('Sem internet agora — tente com sinal');return}
  if(!('caches'in window)){toast('Este navegador não guarda o mapa');return}
  const c=await caches.open('piezo-mapa');let n=0,f=0;
  for(let i=0;i<urls.length;i+=6){await Promise.all(urls.slice(i,i+6).map(async u=>{try{if(await c.match(u)){n++;return}const r=await fetch(u,{mode:'no-cors'});await c.put(u,r);n++}catch(e){f++}}));toast(`Baixando mapa… ${Math.round((i+6)/urls.length*100)}%`)}
  toast(f?`Mapa salvo (${n} partes, ${f} falharam)`:`Mapa de ${DADOS[S.site].nome} salvo para usar sem internet`);
}

/* GPS */
function gpsOn(){
  if(!navigator.geolocation){$('gtxt').textContent='GPS não disponível neste navegador';return}
  $('gtxt').textContent='Procurando sinal de GPS…';
  watch=navigator.geolocation.watchPosition(g=>{pos=[g.coords.latitude,g.coords.longitude];$('gtxt').textContent=`GPS ligado · precisão ±${Math.round(g.coords.accuracy)} m`;$('gpill').textContent='GPS ±'+Math.round(g.coords.accuracy)+' m';$('gpill').classList.add('on');$('gbtn').textContent='Desligar';
    if(!S.ordSet){S.ord='perto'}
    atualizaMapas();
    if(cur){const d=dOf(cur);$('sdist').textContent=d!=null?fm(d):''}else render()},
   e=>{$('gtxt').textContent=e.code===1?'Permissão de localização negada (Ajustes › Safari › Localização)':'Sem sinal de GPS — tente em área aberta'},
   {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
$('gbtn').onclick=()=>{if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;pos=null;$('gtxt').textContent='GPS desligado';$('gpill').textContent='GPS desligado';$('gpill').classList.remove('on');$('gbtn').textContent='Ativar GPS';S.gps=false;save();render()}else{S.gps=true;save();gpsOn()}};

/* eventos */
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.site=b.dataset.s;save();render();scrollTo(0,0)};
$('dt').onchange=e=>{camp().data=e.target.value||hoje();save()};
$('flt').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;S.flt=b.dataset.f;save();render()};
$('ord').onclick=()=>{S.ord=S.ord==='num'?'perto':'num';S.ordSet=true;if(S.ord==='perto'&&!pos)toast('Ative o GPS para ordenar por proximidade');save();render()};
document.querySelector('main').onclick=e=>{const b=e.target.closest('[data-id]');if(b)abrir(b.dataset.id)};
$('sx').onclick=()=>history.back();
let lstV=null;
const LT={ok:['Lidos','Piezômetros da rotina já lidos hoje.'],falta:['Faltam','Piezômetros da rotina ainda sem leitura nesta campanha.'],prob:['Com problema','Marcados hoje como obstruído, seco, danificado, sem acesso etc.']};
function renderLst(){if(!lstV)return;const at=pzs().filter(p=>p.ativo);
  const L=at.filter(p=>lstV==='falta'?!estado(p):estado(p)===lstV).sort((x,y)=>S.ord==='perto'&&pos?((dOf(x)??1e9)-(dOf(y)??1e9)):x.id.localeCompare(y.id,'pt',{numeric:true}));
  $('ltit').textContent=`${LT[lstV][0]} (${L.length})`;$('lsub').textContent=LT[lstV][1]+' · '+DADOS[S.site].nome;
  $('llist').innerHTML=L.length?grupos(L):'<div class="empty">Nenhum piezômetro aqui.</div>'}
document.querySelector('.stats').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;lstV=b.dataset.v;renderLst();$('lst').classList.add('open');$('lst').scrollTop=0;history.pushState({l:1},'')};
$('lx').onclick=()=>history.back();
$('llist').onclick=e=>{const b=e.target.closest('[data-id]');if(b)abrir(b.dataset.id)};
addEventListener('popstate',()=>{if($('sheet').classList.contains('open'))fechar();else if($('lst').classList.contains('open')){$('lst').classList.remove('open');lstV=null}else fechaMapa()});
$('ssave').onclick=()=>{if(salvar())history.back()};
$('snext').onclick=()=>{if(!salvar())return;const n=proximo();if(n)abrir(n.id,false);else history.back()};

render();
if(S.gps)gpsOn();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
